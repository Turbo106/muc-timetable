<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e7f5fb" />
<title>课表 · 第10周</title>
<style>
  /* すみっコぐらし — 静かな隅っこ、パステル、やわらかい線 */
  :root{
    --bg:#f8f5ef;
    --paper:#fffdfa;
    --ink:#6b5d52;
    --dim:rgba(107,93,82,.64);
    --faint:rgba(107,93,82,.42);
    --line:rgba(107,93,82,.16);
    --outline:#a49485;
    --pink:#e7b6c5;
    --row:58px;
    --col:101px;
    --gutter:54px;
    --ease:cubic-bezier(.25,.8,.3,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","HarmonyOS Sans SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:14.5px;line-height:1.5;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;min-height:100dvh;
    letter-spacing:.01em;
  }

  /* 背景：纸感 + 淡插画 + 白纱 */
  body::before{
    content:"";position:fixed;inset:-4%;z-index:0;pointer-events:none;
    background:url("assets/bg.jpg") center 12% / cover no-repeat;
    opacity:.26;
    filter:saturate(.9) contrast(.96);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.82),rgba(248,245,239,.9) 52%,rgba(248,245,239,.96)),
      repeating-linear-gradient(180deg,rgba(107,93,82,.028) 0 1px,transparent 1px 29px);
  }

  .scenery{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 30%,rgba(255,255,255,.9),rgba(255,255,255,.15) 55%,rgba(231,182,197,.28) 100%);border:1px solid rgba(255,255,255,.7);animation:float 11s ease-in-out infinite}
  .b1{width:44px;height:44px;left:8%;top:20%;animation-delay:-2s;opacity:.7}
  .b2{width:26px;height:26px;right:10%;top:12%;animation-delay:-4s;opacity:.6}
  .b3{width:54px;height:54px;right:6%;top:52%;animation-delay:-6s;opacity:.45}
  .b4{width:20px;height:20px;left:14%;top:66%;animation-delay:-3s;opacity:.55}
  .b5{width:34px;height:34px;left:74%;top:82%;animation-delay:-7s;opacity:.4}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

  .shell{position:relative;z-index:2;max-width:560px;margin:0 auto;padding-bottom:104px}

  /* ---------- header ---------- */
  header{padding:calc(26px + env(safe-area-inset-top)) 22px 0;opacity:0;animation:soft .9s var(--ease) forwards}
  @keyframes soft{to{opacity:1}}
  .kicker{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.16em;color:var(--faint);background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 7px}
  .kicker .face{width:18px;height:18px;display:block;opacity:.9}
  .title-row{display:flex;align-items:flex-end;gap:12px;margin-top:20px}
  .bear{width:auto;height:62px;flex:0 0 auto;margin-bottom:-4px;animation:sway 7s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(107,93,82,.12))}
  @keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
  h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em;line-height:1.25;color:#5f5247}
  h1 em{font-style:normal;color:#c98fa2}
  .sub{margin-top:10px;color:var(--dim);font-size:12px;letter-spacing:.04em}

  /* ---------- switch ---------- */
  .switch{position:relative;margin:26px 22px 0;display:flex;padding:4px;border-radius:18px;background:rgba(255,255,255,.72);border:1px solid var(--line);box-shadow:0 8px 20px -18px rgba(107,93,82,.7);opacity:0;animation:soft .9s .1s var(--ease) forwards}
  .switch .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:14px;background:linear-gradient(170deg,#fdf6f8,#f2dfe5);box-shadow:0 2px 8px -4px rgba(201,143,162,.6);transition:transform .55s var(--ease)}
  .switch button{position:relative;z-index:1;flex:1;padding:11px 0 9px;border:0;background:none;color:var(--faint);font:inherit;font-size:13.5px;font-weight:500;letter-spacing:.02em;cursor:pointer;transition:color .4s var(--ease)}
  .switch button[aria-selected="true"]{color:#8a6270}
  .switch button small{display:block;font-size:8.5px;letter-spacing:.18em;color:rgba(107,93,82,.32);margin-top:3px;font-weight:400}

  /* ---------- board ---------- */
  .board{margin-top:22px;transition:opacity .3s ease}
  .board.out{opacity:0}

  .scroller{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .scroller::-webkit-scrollbar{display:none}

  .head{position:sticky;top:0;z-index:6;display:flex;min-width:min-content;padding:4px 22px 10px;background:linear-gradient(180deg,rgba(248,245,239,.96) 70%,rgba(248,245,239,0))}
  .head .spacer{flex:0 0 var(--gutter);position:sticky;left:0;z-index:7;background:linear-gradient(90deg,rgba(248,245,239,.96) 84%,rgba(248,245,239,0))}
  .dh{flex:0 0 var(--col);display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0}
  .dh .w{font-size:10.5px;letter-spacing:.1em;color:var(--faint)}
  .dh .d{font-size:12.5px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .dh.today .w{color:rgba(201,143,162,.95)}
  .dh.today .d{color:#c98fa2}
  .dh.today::after{content:"";width:16px;height:2px;border-radius:2px;background:#e7b6c5;margin-top:1px}

  .grid{position:relative;display:flex;min-width:min-content;padding:0 22px 18px}

  .taxis{position:sticky;left:0;z-index:3;flex:0 0 var(--gutter);background:linear-gradient(90deg,rgba(248,245,239,.97) 86%,rgba(248,245,239,0));padding-right:6px}
  .taxis .slot{height:var(--row);display:flex;flex-direction:column;justify-content:center;gap:1px;color:var(--faint)}
  .taxis .slot b{font-size:11.5px;font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}
  .taxis .slot span{font-size:9.5px;opacity:.8;font-variant-numeric:tabular-nums}
  .taxis .slot.live b,.taxis .slot.live span{color:#c98fa2}

  .day{flex:0 0 var(--col);position:relative;padding:0 3px}
  .day .hline{height:var(--row);border-bottom:1px solid rgba(107,93,82,.07)}
  .day.now::before{content:"";position:absolute;inset:-2px 1px;border-radius:14px;background:linear-gradient(180deg,rgba(247,226,232,.55),rgba(250,242,244,.25) 55%,transparent);pointer-events:none}

  .card{
    position:absolute;left:4px;right:4px;border-radius:16px;padding:9px 10px;overflow:hidden;
    border:1px solid rgba(var(--rgb),.85);
    background:rgb(var(--rgb));
    box-shadow:0 6px 14px -10px rgba(107,93,82,.55);
    cursor:pointer;transform-origin:50% 0;
    opacity:0;transform:translateY(8px);
    animation:rise .72s var(--ease) forwards;animation-delay:var(--d,0ms);
    transition:transform .3s var(--ease),box-shadow .3s var(--ease);
  }
  @keyframes rise{to{opacity:1;transform:translateY(0)}}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(110% 70% at 20% 0%,rgba(255,255,255,.55),transparent 66%);pointer-events:none}
  .card:active{transform:translateY(1px);box-shadow:0 2px 8px -8px rgba(107,93,82,.5)}
  .card .nm{position:relative;z-index:1;font-size:12px;font-weight:600;line-height:1.35;color:#5b4c42;letter-spacing:.01em}
  .card .rm{position:relative;z-index:1;margin-top:4px;font-size:9px;line-height:1.45;color:rgba(91,76,66,.62);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:0}
  .card .nowrap{white-space:nowrap}
  .card .edge{position:absolute;right:7px;top:7px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.85)}
  .card.live{border-color:#d7a0b4;box-shadow:0 0 0 3px rgba(231,182,197,.35),0 6px 14px -10px rgba(107,93,82,.55)}
  .card.live .edge{animation:blink 3.2s ease-in-out infinite}
  @keyframes blink{50%{opacity:.3}}

  .empty{margin:4px 22px 0;padding:34px 24px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.66);color:var(--dim);font-size:12.5px;line-height:1.9;text-align:center}
  .empty .big{display:block;margin-bottom:6px;font-size:13.5px;font-weight:600;color:var(--ink)}
  .empty .big i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e7b6c5;margin-right:7px;vertical-align:middle}
  .empty b{color:#c98fa2;font-weight:600}

  /* ---------- slots ---------- */
  .slots{margin:26px 22px 0;padding:18px 18px 12px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.6)}
  .slots h2{margin:0 0 12px;font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:500}
  .slots ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
  .slots li{display:flex;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1px solid rgba(107,93,82,.07);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .slots li b{color:var(--ink);font-weight:500;font-size:10.5px;min-width:40px}
  .slots .grp{grid-column:1/-1;margin-top:12px;font-size:9.5px;letter-spacing:.16em;color:var(--faint);border-bottom:0}
  .slots .grp:first-child{margin-top:0}

  /* ---------- fab ---------- */
  .fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:30;width:54px;height:54px;border-radius:50%;border:1px solid rgba(201,143,162,.5);background:linear-gradient(165deg,#fdf4f7,#f3dbe3);color:#a8748a;font-size:24px;font-weight:300;line-height:1;display:grid;place-items:center;box-shadow:0 10px 24px -12px rgba(201,143,162,.85);cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
  .fab:active{transform:scale(.94)}
  .fab span{display:block;transform:translateY(-1px)}

  /* ---------- sheets ---------- */
  .veil{position:fixed;inset:0;z-index:40;background:rgba(107,93,82,.22);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .32s var(--ease)}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 auto;padding:20px 24px calc(26px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;border:1px solid var(--line);border-bottom:0;background:var(--paper);box-shadow:0 -18px 44px -24px rgba(107,93,82,.6);transform:translateY(105%);transition:transform .55s var(--ease)}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:38px;height:4px;border-radius:99px;background:#eddbe1;margin:0 auto 18px}
  .sheet .tag{display:inline-flex;align-items:center;font-size:10.5px;letter-spacing:.12em;font-weight:500;color:#8a6270;background:rgba(var(--c,231,182,197),.3);border-radius:99px;padding:3px 11px}
  .sheet h3{margin:13px 0 2px;font-size:20px;font-weight:600;letter-spacing:-.01em;color:#5b4c42}
  .sheet dl{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:12px 18px;font-size:13px}
  .sheet dt{color:var(--faint);letter-spacing:.08em;font-size:11px;padding-top:2px}
  .sheet dd{margin:0;color:var(--ink)}

  .form{display:grid;gap:16px;margin-top:16px}
  .field{display:grid;gap:7px}
  .field label{font-size:10px;letter-spacing:.16em;color:var(--faint)}
  .field input,.field select{width:100%;padding:11px 13px;border-radius:13px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13.5px;outline:none;appearance:none;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
  .field input:focus,.field select:focus{border-color:rgba(201,143,162,.6);box-shadow:0 0 0 3px rgba(231,182,197,.3)}
  .field input::placeholder{color:rgba(107,93,82,.3)}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{padding:7px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--dim);font-size:12px;cursor:pointer;transition:all .3s var(--ease)}
  .pill.on{background:#fbeef2;border-color:rgba(201,143,162,.55);color:#a8748a}
  .sw{width:25px;height:25px;border-radius:50%;border:1px solid rgba(107,93,82,.2);cursor:pointer;transition:transform .3s var(--ease)}
  .sw.on{transform:scale(1.16);box-shadow:0 0 0 3px rgba(231,182,197,.4)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;gap:10px;margin-top:20px}
  .btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .3s var(--ease)}
  .btn:active{background:#faf3f5}
  .btn.primary{background:linear-gradient(165deg,#fdf4f7,#f3dbe3);color:#a8748a;border-color:rgba(201,143,162,.45)}
  .btn.danger{color:#b8748a;border-color:rgba(201,143,162,.3)}

  .foot{margin:26px 22px 0;text-align:center}
  .foot .ebi{height:30px;width:auto;display:block;margin:0 auto 4px;opacity:.85;animation:bob 5s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px)}}
  .foot button{background:none;border:0;color:var(--faint);font:inherit;font-size:11px;letter-spacing:.08em;padding:10px;cursor:pointer}
  .foot button:active{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>

<div class="scenery">
  <svg class="rainbow" viewBox="0 0 600 300" fill="none" preserveAspectRatio="xMidYMin slice">
    <path d="M-40 300 A340 340 0 0 1 640 300" stroke="#ffd3e4" stroke-width="34" opacity=".55"/>
    <path d="M-10 300 A310 310 0 0 1 610 300" stroke="#ffe9bd" stroke-width="30" opacity=".5"/>
    <path d="M20 300 A280 280 0 0 1 580 300" stroke="#d8f2df" stroke-width="26" opacity=".5"/>
    <path d="M50 300 A250 250 0 0 1 550 300" stroke="#d9eefb" stroke-width="22" opacity=".5"/>
  </svg>
  <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
  <span class="bubble b4"></span><span class="bubble b5"></span>
  <span class="twinkle tw1">✦</span><span class="twinkle tw2">✧</span>
  <span class="twinkle tw3">✦</span><span class="twinkle tw4">✧</span>
</div>

<div class="shell">
  <header>
    <div class="kicker">
      <svg class="face" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="21" r="13" fill="#fff" stroke="#6b5240" stroke-width="2"/>
        <circle cx="15.5" cy="20" r="1.6" fill="#4a382b"/>
        <circle cx="24.5" cy="20" r="1.6" fill="#4a382b"/>
        <path d="M18 25q2 2 4 0" stroke="#4a382b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="11" cy="25" r="2.4" fill="#ffc9de" opacity=".9"/>
        <circle cx="29" cy="25" r="2.4" fill="#ffc9de" opacity=".9"/>
      </svg>
      <span>2026–2027 · 第 1 学期</span>
    </div>
    <div class="title-row">
      <img class="bear" src="assets/shirokuma.png" alt="" />
      <h1>第 <em>10</em> 周课表</h1>
    </div>
    <div class="sub" id="range">11.02 – 11.08 · 第10教学周</div>
  </header>

  <div class="switch" role="tablist">
    <div class="thumb" id="thumb"></div>
    <button role="tab" data-campus="tianmuhu" aria-selected="true">天目湖<small>TIANMUHU</small></button>
    <button role="tab" data-campus="jiangjunlu" aria-selected="false">将军路<small>JIANGJUNLU</small></button>
  </div>

  <div class="board" id="board"></div>

  <div class="foot">
    <img class="ebi" src="assets/ebi.png" alt="" />
    <button id="reset">恢复默认课表</button>
  </div>
</div>

<button class="fab" id="fab" aria-label="添加课程"><span>+</span></button>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <span class="tag" id="s-tag">课程</span>
  <h3 id="s-name"></h3>
  <dl>
    <dt>时间</dt><dd id="s-time"></dd>
    <dt>节次</dt><dd id="s-slots"></dd>
    <dt>地点</dt><dd id="s-room"></dd>
    <dt>校区</dt><dd id="s-campus"></dd>
  </dl>
  <div class="actions">
    <button class="btn" id="s-edit">编辑</button>
    <button class="btn" id="s-close">收起</button>
  </div>
</div>

<div class="sheet" id="editor">
  <div class="grab"></div>
  <h3 id="ed-title" style="margin:0">添加课程</h3>
  <div class="form">
    <div class="field">
      <label>课程名</label>
      <input id="ed-name" autocomplete="off" placeholder="例如 视唱练耳(1)">
    </div>
    <div class="field">
      <label>星期</label>
      <div class="pills" id="ed-day"></div>
    </div>
    <div class="field">
      <label>节次</label>
      <div class="row2">
        <select id="ed-start"></select>
        <select id="ed-end"></select>
      </div>
    </div>
    <div class="field">
      <label>地点</label>
      <input id="ed-room" autocomplete="off" placeholder="例如 尚德楼 W203">
    </div>
    <div class="field">
      <label>颜色</label>
      <div class="pills" id="ed-color"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn danger" id="ed-del">删除</button>
    <button class="btn primary" id="ed-save">保存</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const WEEK = [
    {w:"周一", md:"11.02", iso:"2026-11-02"},
    {w:"周二", md:"11.03", iso:"2026-11-03"},
    {w:"周三", md:"11.04", iso:"2026-11-04"},
    {w:"周四", md:"11.05", iso:"2026-11-05"},
    {w:"周五", md:"11.06", iso:"2026-11-06"},
    {w:"周六", md:"11.07", iso:"2026-11-07"},
    {w:"周日", md:"11.08", iso:"2026-11-08"}
  ];

  const TMH = [
    ["08:30","09:20"],["09:25","10:15"],["10:30","11:20"],["11:25","12:15"],
    ["14:00","14:50"],["14:55","15:45"],["16:00","16:50"],["16:55","17:45"],
    ["18:45","19:35"],["19:40","20:30"],["20:35","21:25"]
  ];
  const JJL = [
    ["08:00","08:50"],["08:55","09:45"],["10:15","11:05"],["11:10","12:00"],
    ["14:00","14:50"],["14:55","15:45"],["16:15","17:05"],["17:10","18:00"],
    ["18:45","19:35"],["19:40","20:30"],["20:35","21:25"]
  ];

  const RGB = {
    amber:"232,205,196", coral:"227,181,194", teal:"194,216,201", indigo:"201,195,224",
    mint:"184,208,226", slate:"220,201,214", sand:"232,223,196", stone:"205,212,194"
  };
  const COLORS = Object.keys(RGB);
  const KEY = "muc-timetable-v2";

  const DEFAULT = {
    tianmuhu: {
      label:"天目湖校区", slots: TMH,
      courses: [
        {d:1, s:2, e:2, n:"声乐演唱(1)", r:"西操看台琴房 207-1", c:"amber", g:"专业"},
        {d:1, s:5, e:5, n:"声乐演唱(1)", r:"西操看台琴房 207-1", c:"amber", g:"专业"},
        {d:1, s:6, e:7, n:"钢琴(1)", r:"西操看台琴房 204-2", c:"coral", g:"专业"},
        {d:2, s:7, e:8, n:"思政课(二)", r:"牧星楼 T2201", c:"slate", g:"通识"},
        {d:2, s:9, e:10, n:"军事理论(1)", r:"巡天楼 2楼报告厅", c:"sand", g:"通识"},
        {d:3, s:1, e:2, n:"舞蹈(1)", r:"明慧楼 音乐表演戏剧表演空间 C310", c:"amber", g:"专业"},
        {d:3, s:3, e:4, n:"大学英语III", r:"牧星楼 T2311", c:"slate", g:"语言"},
        {d:3, s:7, e:8, n:"乐理(1)", r:"尚德楼 音乐智慧空间 W203", c:"coral", g:"理论"},
        {d:4, s:1, e:2, n:"乐理(1)", r:"尚德楼 音乐智慧空间 W203", c:"coral", g:"理论"},
        {d:4, s:3, e:4, n:"人工智能导论II", r:"线上授课", c:"mint", g:"通识"},
        {d:4, s:5, e:6, n:"艺术概论", r:"明慧楼 C210", c:"stone", g:"理论"},
        {d:4, s:7, e:8, n:"视唱练耳(1)", r:"尚德楼 音乐智慧空间 W203", c:"indigo", g:"专业"},
        {d:4, s:9, e:10, n:"行政管理学", r:"巡天楼 T1411", c:"mint", g:"通识"},
        {d:5, s:1, e:2, n:"舞蹈(1)", r:"明慧楼 音乐表演戏剧表演空间 C310", c:"amber", g:"专业"},
        {d:5, s:3, e:4, n:"音乐表演专业导论", r:"尚德楼 音乐智慧空间 W203", c:"teal", g:"专业"}
      ]
    },
    jiangjunlu: { label:"将军路校区", slots: JJL, courses: [] }
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));

  function load() {
    const base = clone(DEFAULT);
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { saved = null; }
    if (saved && typeof saved === "object") {
      if (Array.isArray(saved.tianmuhu)) base.tianmuhu.courses = saved.tianmuhu;
      if (Array.isArray(saved.jiangjunlu)) base.jiangjunlu.courses = saved.jiangjunlu;
    }
    return base;
  }
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        tianmuhu: DATA.tianmuhu.courses,
        jiangjunlu: DATA.jiangjunlu.courses
      }));
    } catch (e) {}
  }

  let DATA = load();
  let current = "tianmuhu", busy = false;
  let editing = { scope: null, index: null };
  let pickDay = 1, pickColor = "amber", lastPick = null, armed = false;

  const $ = (id) => document.getElementById(id);
  const board = $("board"), thumb = $("thumb"), veil = $("veil");
  const sheet = $("sheet"), editor = $("editor");
  const buttons = [...document.querySelectorAll(".switch button")];

  const nowISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const todayIdx = () => {
    const hit = WEEK.findIndex((w) => w.iso === nowISO());
    return hit === -1 ? -1 : hit + 1;
  };
  const liveIdx = () => {
    const n = new Date(), m = n.getHours()*60 + n.getMinutes();
    let idx = -1;
    DATA[current].slots.forEach(([a,b], i) => {
      const [h1,m1] = a.split(":").map(Number), [h2,m2] = b.split(":").map(Number);
      if (m >= h1*60+m1 && m <= h2*60+m2) idx = i + 1;
    });
    return idx;
  };

  function render(key, animate) {
    animate = animate !== false;
    const campus = DATA[key];
    const today = todayIdx(), live = liveIdx(), rowH = 58;
    const prevScroller = board.querySelector(".scroller");
    const keepLeft = prevScroller ? prevScroller.scrollLeft : 0;

    if (animate) board.classList.add("out");

    setTimeout(() => {
      const p = [];

      if (campus.courses.length) {
        p.push('<div class="scroller">');
        p.push('<div class="head"><div class="spacer"></div>');
        WEEK.forEach((d, i) => {
          p.push(`<div class="dh${i+1 === today ? " today" : ""}"><span class="w">${d.w}</span><span class="d">${d.md}</span></div>`);
        });
        p.push("</div>");

        p.push('<div class="grid">');
        p.push('<div class="taxis">');
        campus.slots.forEach(([a], i) => {
          p.push(`<div class="slot${i+1 === live ? " live" : ""}"><b>${i+1}</b><span>${a}</span></div>`);
        });
        p.push("</div>");

        WEEK.forEach((d, di) => {
          const dayNo = di + 1, isToday = dayNo === today;
          p.push(`<div class="day${isToday ? " now" : ""}" data-day="${dayNo}">`);
          campus.slots.forEach(() => p.push('<div class="hline"></div>'));

          campus.courses.forEach((c, ci) => {
            if (c.d !== dayNo) return;
            const top = (c.s - 1) * rowH + 4;
            const h = (c.e - c.s + 1) * rowH - 8;
            const isLive = isToday && live >= c.s && live <= c.e;
            p.push(
              `<div class="card${isLive ? " live" : ""}" role="button" tabindex="0" data-i="${ci}" ` +
              `style="--rgb:${RGB[c.c] || RGB.amber};top:${top}px;height:${h}px;--d:${50 + (di*3 + ci%4)*32}ms">` +
              `<span class="edge"></span><div class="nm">${String(c.n).replace(/([（(][^）)]*[）)])/g, "<span class=nowrap>$1</span>")}</div>` +
              (h > 86 && c.r ? `<div class="rm">${c.r}</div>` : "") +
              `</div>`
            );
          });

          p.push("</div>");
        });
        p.push("</div></div>");
      } else {
        p.push('<div class="empty"><div class="big"><i></i>本周还没有课</div>点右下角的 <b>+</b> 添加，或者先看看下方这个校区的作息时间。</div>');
      }

      p.push('<div class="slots"><h2>' + campus.label + ' · 上课时间</h2><ol>');
      [["上午 · 第 1–4 节",[0,1,2,3]],["下午 · 第 5–8 节",[4,5,6,7]],["晚上 · 第 9–11 节",[8,9,10]]]
        .forEach(([name, idxs]) => {
          p.push(`<li class="grp">${name}</li>`);
          idxs.forEach((i) => {
            const [a,b] = campus.slots[i];
            p.push(`<li><b>第${i+1}节</b><span>${a} – ${b}</span></li>`);
          });
        });
      p.push("</ol></div>");

      board.innerHTML = p.join("");
      if (!animate) board.querySelectorAll(".card").forEach((el) => { el.style.animation = "none"; });
      board.classList.remove("out");

      board.querySelectorAll(".card").forEach((el) => {
        const idx = Number(el.dataset.i);
        const open = () => openSheet(campus.courses[idx], idx);
        el.addEventListener("click", open);
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      });

      const sc = board.querySelector(".scroller");
      const target = board.querySelector(`.day[data-day="${today}"]`);
      if (sc) {
        if (animate && target && today > 3) sc.scrollTo({ left: Math.max(0, target.offsetLeft - 130), behavior: "smooth" });
        else sc.scrollLeft = keepLeft;
      }
    }, animate ? 170 : 0);
  }

  function openSheet(c, idx) {
    if (!c) return;
    lastPick = { scope: current, index: idx };
    const campus = DATA[current];
    const [a] = campus.slots[c.s - 1], [, b] = campus.slots[c.e - 1];
    $("s-tag").textContent = c.g || "课程";
    $("s-tag").style.setProperty("--c", `rgb(${RGB[c.c] || RGB.amber})`);
    $("s-name").textContent = c.n;
    $("s-time").textContent = `${a} – ${b}`;
    $("s-slots").textContent = c.s === c.e ? `第 ${c.s} 节` : `第 ${c.s} – ${c.e} 节`;
    $("s-room").textContent = c.r || "—";
    $("s-campus").textContent = campus.label;
    veil.classList.add("on");
    sheet.classList.add("on");
  }

  function closeSheet() {
    veil.classList.remove("on");
    sheet.classList.remove("on");
    editor.classList.remove("on");
  }

  function openEditor(scope, index) {
    const isNew = index === null || index === undefined;
    const campus = DATA[scope];
    const src = isNew ? {d:1, s:1, e:1, n:"", r:"", c:"amber", g:"课程"} : campus.courses[index];
    if (!src) return;
    editing = { scope, index: isNew ? null : index };
    pickDay = src.d;
    pickColor = src.c || "amber";

    $("ed-title").textContent = isNew ? "添加到" + campus.label : "编辑课程";
    $("ed-name").value = src.n;
    $("ed-room").value = src.r || "";

    $("ed-day").innerHTML = WEEK.map((w, i) =>
      `<button type="button" class="pill${i+1 === pickDay ? " on" : ""}" data-day="${i+1}">${w.w.slice(1)}</button>`
    ).join("");

    $("ed-color").innerHTML = COLORS.map((k) =>
      `<button type="button" class="sw${k === pickColor ? " on" : ""}" data-c="${k}" style="background:rgb(${RGB[k]})"></button>`
    ).join("");

    const opts = campus.slots.map(([a], i) => `<option value="${i+1}">第${i+1}节 ${a}</option>`).join("");
    $("ed-start").innerHTML = opts;
    $("ed-end").innerHTML = opts;
    $("ed-start").value = src.s;
    $("ed-end").value = src.e;

    $("ed-del").style.display = isNew ? "none" : "";
    $("ed-del").textContent = "删除";
    armed = false;

    closeSheet();
    veil.classList.add("on");
    editor.classList.add("on");
    setTimeout(() => { try { $("ed-name").focus({ preventScroll: true }); } catch (e) {} }, 480);
  }

  function commit() {
    const name = $("ed-name").value.trim();
    if (!name) {
      $("ed-name").style.borderColor = "rgba(255,139,120,.75)";
      $("ed-name").focus();
      return;
    }
    let s = Number($("ed-start").value);
    let e = Number($("ed-end").value);
    if (e < s) e = s;
    const scope = editing.scope, list = DATA[scope].courses;
    const prev = editing.index === null ? null : list[editing.index];
    const course = {
      d: pickDay, s, e,
      n: name,
      r: $("ed-room").value.trim() || "地点待定",
      c: pickColor,
      g: (prev && prev.g) || "课程"
    };
    if (editing.index === null) list.push(course);
    else list[editing.index] = course;
    persist();
    closeSheet();
    render(current, true);
  }

  function removeCourse() {
    if (editing.index === null) return;
    DATA[editing.scope].courses.splice(editing.index, 1);
    persist();
    closeSheet();
    render(current, true);
  }

  veil.addEventListener("click", closeSheet);
  $("s-close").addEventListener("click", closeSheet);
  $("s-edit").addEventListener("click", () => {
    if (lastPick) openEditor(lastPick.scope, lastPick.index);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  $("fab").addEventListener("click", () => openEditor(current, null));

  $("ed-day").addEventListener("click", (e) => {
    const b = e.target.closest("[data-day]");
    if (!b) return;
    pickDay = Number(b.dataset.day);
    [...$("ed-day").children].forEach((x) => x.classList.toggle("on", x === b));
  });
  $("ed-color").addEventListener("click", (e) => {
    const b = e.target.closest("[data-c]");
    if (!b) return;
    pickColor = b.dataset.c;
    [...$("ed-color").children].forEach((x) => x.classList.toggle("on", x === b));
  });
  $("ed-name").addEventListener("input", () => { $("ed-name").style.borderColor = "var(--line)"; });
  $("ed-save").addEventListener("click", commit);

  $("ed-del").addEventListener("click", () => {
    if (!armed) {
      armed = true;
      $("ed-del").textContent = "再点一次确认";
      setTimeout(() => { if (armed) { armed = false; $("ed-del").textContent = "删除"; } }, 3200);
      return;
    }
    removeCourse();
  });

  let resetArmed = false;
  $("reset").addEventListener("click", () => {
    if (!resetArmed) {
      resetArmed = true;
      $("reset").textContent = "再点一次恢复默认（会清掉你加的）";
      setTimeout(() => { if (resetArmed) { resetArmed = false; $("reset").textContent = "恢复默认课表"; } }, 3200);
      return;
    }
    resetArmed = false;
    $("reset").textContent = "恢复默认课表";
    try { localStorage.removeItem(KEY); } catch (e) {}
    DATA = load();
    render(current, true);
  });

  buttons.forEach((btn, i) => {
    btn.addEventListener("click", () => {
      if (busy || btn.dataset.campus === current) return;
      busy = true;
      current = btn.dataset.campus;
      buttons.forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
      thumb.style.transform = `translateX(${i * 100}%)`;
      render(current, true);
      setTimeout(() => { busy = false; }, 540);
    });
  });

  const t = todayIdx();
  if (t > 0) $("range").textContent = `11.02 – 11.08 · 第10教学周 · 今天是${WEEK[t-1].w}`;

  render("tianmuhu", true);
  setInterval(() => { if (!document.hidden) render(current, false); }, 60000);
})();
</script>
</body>
</html>
