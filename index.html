<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e7f5fb" />
<title>课表 · 第10周</title>
<style>
  :root{
    --sky:#eaf7fd;
    --sky2:#d7edf9;
    --paper:#ffffff;
    --ink:#5b4636;
    --dim:rgba(91,70,54,.60);
    --faint:rgba(91,70,54,.40);
    --line:rgba(107,82,64,.16);
    --outline:#6b5240;
    --pink:#ff9fc6;
    --pink-soft:#ffe4ef;
    --row:58px;
    --col:101px;
    --gutter:54px;
    --ease:cubic-bezier(.34,1.45,.5,1);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 52%,var(--sky) 100%);
    background-attachment:fixed;
    color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
    overflow-x:hidden;min-height:100dvh;
  }

  /* ---------- scenery ---------- */
  .scenery{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .scenery .rainbow{position:absolute;top:-6vh;left:50%;transform:translateX(-50%);width:120vw;opacity:.5}
  .bubble{position:absolute;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95),rgba(255,255,255,.2) 46%,rgba(255,214,236,.5) 100%);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 0 14px rgba(255,255,255,.8);animation:float 9s ease-in-out infinite}
  .b1{width:54px;height:54px;left:5%;top:15%;animation-delay:-1s;opacity:.9}
  .b2{width:30px;height:30px;right:9%;top:9%;animation-delay:-3.5s}
  .b3{width:66px;height:66px;right:4%;top:44%;animation-delay:-5s;opacity:.66}
  .b4{width:24px;height:24px;left:12%;top:62%;animation-delay:-2.2s;opacity:.8}
  .b5{width:40px;height:40px;left:70%;top:78%;animation-delay:-6.4s;opacity:.7}
  @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-14px) scale(1.04)}}
  .twinkle{position:absolute;color:#fff;opacity:.9;animation:tw 3.2s ease-in-out infinite}
  .tw1{left:16%;top:22%;font-size:13px;animation-delay:-.8s}
  .tw2{right:20%;top:32%;font-size:11px;animation-delay:-2s}
  .tw3{left:78%;top:58%;font-size:14px;animation-delay:-1.4s}
  .tw4{left:8%;top:82%;font-size:10px;animation-delay:-2.6s}
  @keyframes tw{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}

  .shell{position:relative;z-index:2;max-width:560px;margin:0 auto;padding-bottom:96px}

  /* ---------- header ---------- */
  header{padding:calc(20px + env(safe-area-inset-top)) 20px 0;animation:pop .7s var(--ease) both}
  @keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
  .kicker{display:inline-flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;color:var(--dim);background:rgba(255,255,255,.75);border:2px solid var(--outline);border-radius:999px;padding:4px 12px 4px 8px}
  .kicker .face{width:20px;height:20px;display:block}
  .title-row{display:flex;align-items:center;gap:10px;margin-top:14px}
  .bear{width:52px;height:52px;flex:0 0 auto;animation:sway 4.5s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:#4a382b}
  h1 em{font-style:normal;color:#ff7fb0}
  .sub{margin-top:8px;color:var(--dim);font-size:12.5px}

  /* ---------- switch ---------- */
  .switch{position:relative;margin:20px 20px 0;display:flex;padding:5px;border-radius:20px;background:rgba(255,255,255,.85);border:2px solid var(--outline);box-shadow:0 3px 0 rgba(107,82,64,.18);animation:pop .7s .06s var(--ease) both}
  .switch .thumb{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:15px;background:linear-gradient(150deg,#ffd0e3,#ffb0cb);box-shadow:inset 0 -2px 0 rgba(255,255,255,.6);transition:transform .5s var(--ease)}
  .switch button{position:relative;z-index:1;flex:1;padding:10px 0 9px;border:0;background:none;color:var(--dim);font:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:color .3s var(--ease)}
  .switch button[aria-selected="true"]{color:#8a4a68}
  .switch button small{display:block;font-size:9px;letter-spacing:.14em;color:var(--faint);margin-top:2px;font-weight:600}

  /* ---------- board ---------- */
  .board{margin-top:20px;transition:opacity .22s ease,transform .22s ease}
  .board.out{opacity:0;transform:translateY(8px)}

  .scroller{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:8px}
  .scroller::-webkit-scrollbar{display:none}

  .head{position:sticky;top:0;z-index:6;display:flex;min-width:min-content;padding:0 20px 8px;background:linear-gradient(180deg,rgba(234,247,253,.98) 64%,rgba(234,247,253,0))}
  .head .spacer{flex:0 0 var(--gutter);position:sticky;left:0;z-index:7;background:linear-gradient(90deg,rgba(234,247,253,.98) 78%,rgba(234,247,253,0))}
  .dh{flex:0 0 var(--col);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:14px}
  .dh .w{font-size:11px;letter-spacing:.04em;color:var(--faint);font-weight:600}
  .dh .d{font-size:13.5px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .dh.today{background:linear-gradient(160deg,#ffd9e8,#ffeef5);border:2px solid #ffb0cb}
  .dh.today .w{color:#c9628e}
  .dh.today .d{color:#d1618f}

  .grid{position:relative;display:flex;min-width:min-content;padding:0 20px 16px}

  .taxis{position:sticky;left:0;z-index:3;flex:0 0 var(--gutter);background:linear-gradient(90deg,rgba(234,247,253,.98) 82%,rgba(234,247,253,0));padding-right:6px}
  .taxis .slot{height:var(--row);display:flex;flex-direction:column;justify-content:center;gap:1px;color:var(--faint)}
  .taxis .slot b{font-size:12px;font-weight:800;color:var(--dim);font-variant-numeric:tabular-nums}
  .taxis .slot span{font-size:9px;opacity:.85;font-variant-numeric:tabular-nums}
  .taxis .slot.live b,.taxis .slot.live span{color:#e0629a}

  .day{flex:0 0 var(--col);position:relative;padding:0 3px}
  .day .hline{height:var(--row);border-bottom:1.5px dashed rgba(107,82,64,.13)}
  .day.now::before{content:"";position:absolute;inset:-4px 0;border-radius:16px;background:linear-gradient(180deg,rgba(255,214,232,.32),rgba(255,240,247,.14) 60%,transparent);pointer-events:none}

  .card{
    position:absolute;left:4px;right:4px;border-radius:17px;padding:8px 9px;overflow:hidden;
    border:2px solid var(--outline);
    background:rgb(var(--rgb));
    box-shadow:0 3px 0 rgba(107,82,64,.25),0 9px 16px -12px rgba(107,82,64,.55);
    cursor:pointer;transform-origin:50% 0;
    opacity:0;transform:translateY(14px) scale(.9);
    animation:rise .62s var(--ease) forwards;animation-delay:var(--d,0ms);
    transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  }
  @keyframes rise{60%{opacity:1;transform:translateY(-2px) scale(1.02)}to{opacity:1;transform:translateY(0) scale(1)}}
  .card::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 70% at 18% 0%,rgba(255,255,255,.75),transparent 62%);pointer-events:none}
  .card:active{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 rgba(107,82,64,.25)}
  .card .nm{position:relative;z-index:1;font-size:12.2px;font-weight:800;line-height:1.3;letter-spacing:-.01em;color:#4a382b}
  .card .rm{position:relative;z-index:1;margin-top:4px;font-size:9.5px;line-height:1.4;color:rgba(74,56,43,.68);font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .card .nowrap{white-space:nowrap}
  .card .edge{position:absolute;right:6px;top:6px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.9);box-shadow:0 0 0 1.5px rgba(107,82,64,.22)}
  .card.live{border-color:#e0629a;box-shadow:0 0 0 3px rgba(255,159,198,.45),0 3px 0 rgba(107,82,64,.25)}
  .card.live .edge{animation:breathe 2.6s ease-in-out infinite}
  @keyframes breathe{50%{opacity:.25;transform:scale(.7)}}

  .empty{margin:2px 20px 0;padding:28px 22px;border-radius:20px;border:2px dashed rgba(107,82,64,.28);background:rgba(255,255,255,.8);color:var(--dim);font-size:13px;line-height:1.8;text-align:center;animation:pop .6s var(--ease) both}
  .empty .big{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px;font-size:15px;font-weight:800;color:var(--ink)}
  .empty .big i{width:9px;height:9px;border-radius:50%;background:#ffb0cb;box-shadow:0 0 0 3px rgba(255,176,203,.3);font-style:normal}
  .empty b{color:#d1618f}

  /* ---------- slots ---------- */
  .slots{margin:24px 20px 0;padding:16px;border-radius:22px;border:2px solid var(--outline);background:rgba(255,255,255,.86);box-shadow:0 3px 0 rgba(107,82,64,.18)}
  .slots h2{margin:0 0 10px;font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:800}
  .slots ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
  .slots li{display:flex;justify-content:space-between;gap:6px;padding:6px 0;border-bottom:1.5px dashed rgba(107,82,64,.12);font-size:11.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  .slots li b{color:var(--ink);font-weight:800;font-size:11px;min-width:42px}
  .slots .grp{grid-column:1/-1;margin-top:10px;font-size:10px;letter-spacing:.16em;color:var(--faint);border-bottom:0;font-weight:800}
  .slots .grp:first-child{margin-top:0}

  /* ---------- fab ---------- */
  .fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%;border:2px solid var(--outline);background:linear-gradient(150deg,#ffd0e3,#ff9fc6);color:#7a3f5c;font-size:27px;font-weight:400;line-height:1;display:grid;place-items:center;box-shadow:0 4px 0 rgba(107,82,64,.3),0 12px 22px -10px rgba(255,127,176,.75);cursor:pointer;transition:transform .3s var(--ease)}
  .fab:active{transform:translateY(3px) scale(.96);box-shadow:0 1px 0 rgba(107,82,64,.3)}
  .fab span{display:block;transform:translateY(-1px)}

  /* ---------- sheets ---------- */
  .veil{position:fixed;inset:0;z-index:40;background:rgba(107,82,64,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
  .veil.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 auto;padding:20px 22px calc(24px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0;border:2px solid var(--outline);border-bottom:0;background:#fffdfe;box-shadow:0 -14px 40px -18px rgba(107,82,64,.5);transform:translateY(105%);transition:transform .52s var(--ease)}
  .sheet.on{transform:translateY(0)}
  .sheet .grab{width:44px;height:5px;border-radius:99px;background:#ffc9de;margin:0 auto 16px}
  .sheet .tag{display:inline-flex;align-items:center;font-size:11px;letter-spacing:.1em;font-weight:800;color:#7a5a48;background:rgba(var(--c,255,176,203),.35);border:2px solid var(--outline);border-radius:99px;padding:3px 11px}
  .sheet h3{margin:12px 0 2px;font-size:22px;font-weight:800;letter-spacing:-.02em;color:#4a382b}
  .sheet dl{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:11px 16px;font-size:13.5px}
  .sheet dt{color:var(--faint);letter-spacing:.06em;font-size:11.5px;font-weight:800;padding-top:2px}
  .sheet dd{margin:0;color:var(--ink);font-weight:600}

  .form{display:grid;gap:14px;margin-top:14px}
  .field{display:grid;gap:6px}
  .field label{font-size:10.5px;letter-spacing:.14em;color:var(--faint);font-weight:800}
  .field input,.field select{width:100%;padding:11px 13px;border-radius:14px;border:2px solid var(--outline);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;outline:none;appearance:none;transition:box-shadow .25s var(--ease)}
  .field input:focus,.field select:focus{box-shadow:0 0 0 3px rgba(255,176,203,.45)}
  .field input::placeholder{color:rgba(91,70,54,.32);font-weight:500}
  .pills{display:flex;flex-wrap:wrap;gap:7px}
  .pill{padding:7px 12px;border-radius:12px;border:2px solid var(--outline);background:#fff;color:var(--dim);font-size:12.5px;font-weight:700;cursor:pointer;transition:all .25s var(--ease)}
  .pill.on{background:#ffcfe2;color:#8a4a68;box-shadow:0 2px 0 rgba(107,82,64,.25)}
  .sw{width:27px;height:27px;border-radius:50%;border:2px solid var(--outline);cursor:pointer;transition:transform .25s var(--ease)}
  .sw.on{transform:scale(1.18);box-shadow:0 0 0 3px rgba(255,176,203,.5)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .actions{display:flex;gap:10px;margin-top:18px}
  .btn{flex:1;padding:12px;border-radius:15px;border:2px solid var(--outline);background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 rgba(107,82,64,.2);transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(107,82,64,.2)}
  .btn.primary{background:linear-gradient(150deg,#ffd0e3,#ff9fc6);color:#7a3f5c;border-color:#c97a9b}
  .btn.danger{color:#c0546f;border-color:#e3a3b6}

  .foot{margin:22px 20px 0;text-align:center}
  .foot button{background:none;border:0;color:var(--faint);font:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;padding:10px;cursor:pointer}
  .foot button:active{color:var(--ink)}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>

<div class="scenery">
  <svg class="rainbow" viewBox="0 0 600 300" fill="none" preserveAspectRatio="xMidYMin slice">
    <path d="M-40 300 A340 340 0 0 1 640 300" stroke="#ffd3e4" stroke-width="34" opacity=".55"/>
    <path d="M-10 300 A310 310 0 0 1 610 300" stroke="#ffe9bd" stroke-width="30" opacity=".5"/>
    <path d="M20 300 A280 280 0 0 1 580 300" stroke="#d8f2df" stroke-width="26" opacity=".5"/>
    <path d="M50 300 A250 250 0 0 1 550 300" stroke="#d9eefb" stroke-width="22" opacity=".5"/>
  </svg>
  <span class="bubble b1"></span><span class="bubble b2"></span><span class="bubble b3"></span>
  <span class="bubble b4"></span><span class="bubble b5"></span>
  <span class="twinkle tw1">✦</span><span class="twinkle tw2">✧</span>
  <span class="twinkle tw3">✦</span><span class="twinkle tw4">✧</span>
</div>

<div class="shell">
  <header>
    <div class="kicker">
      <svg class="face" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="21" r="13" fill="#fff" stroke="#6b5240" stroke-width="2"/>
        <circle cx="15.5" cy="20" r="1.6" fill="#4a382b"/>
        <circle cx="24.5" cy="20" r="1.6" fill="#4a382b"/>
        <path d="M18 25q2 2 4 0" stroke="#4a382b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <circle cx="11" cy="25" r="2.4" fill="#ffc9de" opacity=".9"/>
        <circle cx="29" cy="25" r="2.4" fill="#ffc9de" opacity=".9"/>
      </svg>
      <span>2026–2027 · 第 1 学期</span>
    </div>
    <div class="title-row">
      <svg class="bear" viewBox="0 0 60 60" aria-hidden="true">
        <path d="M14 20c-3-6 2-11 8-8" fill="#fff" stroke="#6b5240" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M46 20c3-6-2-11-8-8" fill="#fff" stroke="#6b5240" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="30" cy="33" r="17" fill="#fff" stroke="#6b5240" stroke-width="2.6"/>
        <circle cx="24" cy="31" r="1.9" fill="#4a382b"/>
        <circle cx="36" cy="31" r="1.9" fill="#4a382b"/>
        <path d="M27.5 37q2.5 2.4 5 0" stroke="#4a382b" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="18.5" cy="37" r="3" fill="#ffc9de" opacity=".85"/>
        <circle cx="41.5" cy="37" r="3" fill="#ffc9de" opacity=".85"/>
      </svg>
      <h1>第 <em>10</em> 周课表</h1>
    </div>
    <div class="sub" id="range">11.02 – 11.08 · 第10教学周</div>
  </header>

  <div class="switch" role="tablist">
    <div class="thumb" id="thumb"></div>
    <button role="tab" data-campus="tianmuhu" aria-selected="true">天目湖<small>TIANMUHU</small></button>
    <button role="tab" data-campus="jiangjunlu" aria-selected="false">将军路<small>JIANGJUNLU</small></button>
  </div>

  <div class="board" id="board"></div>

  <div class="foot">
    <button id="reset">恢复默认课表</button>
  </div>
</div>

<button class="fab" id="fab" aria-label="添加课程"><span>+</span></button>

<div class="veil" id="veil"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <span class="tag" id="s-tag">课程</span>
  <h3 id="s-name"></h3>
  <dl>
    <dt>时间</dt><dd id="s-time"></dd>
    <dt>节次</dt><dd id="s-slots"></dd>
    <dt>地点</dt><dd id="s-room"></dd>
    <dt>校区</dt><dd id="s-campus"></dd>
  </dl>
  <div class="actions">
    <button class="btn" id="s-edit">编辑</button>
    <button class="btn" id="s-close">收起</button>
  </div>
</div>

<div class="sheet" id="editor">
  <div class="grab"></div>
  <h3 id="ed-title" style="margin:0">添加课程</h3>
  <div class="form">
    <div class="field">
      <label>课程名</label>
      <input id="ed-name" autocomplete="off" placeholder="例如 视唱练耳(1)">
    </div>
    <div class="field">
      <label>星期</label>
      <div class="pills" id="ed-day"></div>
    </div>
    <div class="field">
      <label>节次</label>
      <div class="row2">
        <select id="ed-start"></select>
        <select id="ed-end"></select>
      </div>
    </div>
    <div class="field">
      <label>地点</label>
      <input id="ed-room" autocomplete="off" placeholder="例如 尚德楼 W203">
    </div>
    <div class="field">
      <label>颜色</label>
      <div class="pills" id="ed-color"></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn danger" id="ed-del">删除</button>
    <button class="btn primary" id="ed-save">保存</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  const WEEK = [
    {w:"周一", md:"11.02", iso:"2026-11-02"},
    {w:"周二", md:"11.03", iso:"2026-11-03"},
    {w:"周三", md:"11.04", iso:"2026-11-04"},
    {w:"周四", md:"11.05", iso:"2026-11-05"},
    {w:"周五", md:"11.06", iso:"2026-11-06"},
    {w:"周六", md:"11.07", iso:"2026-11-07"},
    {w:"周日", md:"11.08", iso:"2026-11-08"}
  ];

  const TMH = [
    ["08:30","09:20"],["09:25","10:15"],["10:30","11:20"],["11:25","12:15"],
    ["14:00","14:50"],["14:55","15:45"],["16:00","16:50"],["16:55","17:45"],
    ["18:45","19:35"],["19:40","20:30"],["20:35","21:25"]
  ];
  const JJL = [
    ["08:00","08:50"],["08:55","09:45"],["10:15","11:05"],["11:10","12:00"],
    ["14:00","14:50"],["14:55","15:45"],["16:15","17:05"],["17:10","18:00"],
    ["18:45","19:35"],["19:40","20:30"],["20:35","21:25"]
  ];

  const RGB = {
    amber:"247,182,205", coral:"255,190,168", teal:"183,229,201", indigo:"202,189,242",
    mint:"174,224,245", slate:"217,198,239", sand:"243,226,184", stone:"238,240,169"
  };
  const COLORS = Object.keys(RGB);
  const KEY = "muc-timetable-v2";

  const DEFAULT = {
    tianmuhu: {
      label:"天目湖校区", slots: TMH,
      courses: [
        {d:1, s:2, e:2, n:"声乐演唱(1)", r:"西操看台琴房 207-1", c:"amber", g:"专业"},
        {d:1, s:5, e:5, n:"声乐演唱(1)", r:"西操看台琴房 207-1", c:"amber", g:"专业"},
        {d:1, s:6, e:7, n:"钢琴(1)", r:"西操看台琴房 204-2", c:"coral", g:"专业"},
        {d:2, s:7, e:8, n:"思政课(二)", r:"牧星楼 T2201", c:"slate", g:"通识"},
        {d:2, s:9, e:10, n:"军事理论(1)", r:"巡天楼 2楼报告厅", c:"sand", g:"通识"},
        {d:3, s:1, e:2, n:"舞蹈(1)", r:"明慧楼 音乐表演戏剧表演空间 C310", c:"amber", g:"专业"},
        {d:3, s:3, e:4, n:"大学英语III", r:"牧星楼 T2311", c:"slate", g:"语言"},
        {d:3, s:7, e:8, n:"乐理(1)", r:"尚德楼 音乐智慧空间 W203", c:"coral", g:"理论"},
        {d:4, s:1, e:2, n:"乐理(1)", r:"尚德楼 音乐智慧空间 W203", c:"coral", g:"理论"},
        {d:4, s:3, e:4, n:"人工智能导论II", r:"线上授课", c:"mint", g:"通识"},
        {d:4, s:5, e:6, n:"艺术概论", r:"明慧楼 C210", c:"stone", g:"理论"},
        {d:4, s:7, e:8, n:"视唱练耳(1)", r:"尚德楼 音乐智慧空间 W203", c:"indigo", g:"专业"},
        {d:4, s:9, e:10, n:"行政管理学", r:"巡天楼 T1411", c:"mint", g:"通识"},
        {d:5, s:1, e:2, n:"舞蹈(1)", r:"明慧楼 音乐表演戏剧表演空间 C310", c:"amber", g:"专业"},
        {d:5, s:3, e:4, n:"音乐表演专业导论", r:"尚德楼 音乐智慧空间 W203", c:"teal", g:"专业"}
      ]
    },
    jiangjunlu: { label:"将军路校区", slots: JJL, courses: [] }
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));

  function load() {
    const base = clone(DEFAULT);
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) { saved = null; }
    if (saved && typeof saved === "object") {
      if (Array.isArray(saved.tianmuhu)) base.tianmuhu.courses = saved.tianmuhu;
      if (Array.isArray(saved.jiangjunlu)) base.jiangjunlu.courses = saved.jiangjunlu;
    }
    return base;
  }
  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify({
        tianmuhu: DATA.tianmuhu.courses,
        jiangjunlu: DATA.jiangjunlu.courses
      }));
    } catch (e) {}
  }

  let DATA = load();
  let current = "tianmuhu", busy = false;
  let editing = { scope: null, index: null };
  let pickDay = 1, pickColor = "amber", lastPick = null, armed = false;

  const $ = (id) => document.getElementById(id);
  const board = $("board"), thumb = $("thumb"), veil = $("veil");
  const sheet = $("sheet"), editor = $("editor");
  const buttons = [...document.querySelectorAll(".switch button")];

  const nowISO = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  };
  const todayIdx = () => {
    const hit = WEEK.findIndex((w) => w.iso === nowISO());
    return hit === -1 ? -1 : hit + 1;
  };
  const liveIdx = () => {
    const n = new Date(), m = n.getHours()*60 + n.getMinutes();
    let idx = -1;
    DATA[current].slots.forEach(([a,b], i) => {
      const [h1,m1] = a.split(":").map(Number), [h2,m2] = b.split(":").map(Number);
      if (m >= h1*60+m1 && m <= h2*60+m2) idx = i + 1;
    });
    return idx;
  };

  function render(key, animate) {
    animate = animate !== false;
    const campus = DATA[key];
    const today = todayIdx(), live = liveIdx(), rowH = 58;
    const prevScroller = board.querySelector(".scroller");
    const keepLeft = prevScroller ? prevScroller.scrollLeft : 0;

    if (animate) board.classList.add("out");

    setTimeout(() => {
      const p = [];

      if (campus.courses.length) {
        p.push('<div class="scroller">');
        p.push('<div class="head"><div class="spacer"></div>');
        WEEK.forEach((d, i) => {
          p.push(`<div class="dh${i+1 === today ? " today" : ""}"><span class="w">${d.w}</span><span class="d">${d.md}</span></div>`);
        });
        p.push("</div>");

        p.push('<div class="grid">');
        p.push('<div class="taxis">');
        campus.slots.forEach(([a], i) => {
          p.push(`<div class="slot${i+1 === live ? " live" : ""}"><b>${i+1}</b><span>${a}</span></div>`);
        });
        p.push("</div>");

        WEEK.forEach((d, di) => {
          const dayNo = di + 1, isToday = dayNo === today;
          p.push(`<div class="day${isToday ? " now" : ""}" data-day="${dayNo}">`);
          campus.slots.forEach(() => p.push('<div class="hline"></div>'));

          campus.courses.forEach((c, ci) => {
            if (c.d !== dayNo) return;
            const top = (c.s - 1) * rowH + 4;
            const h = (c.e - c.s + 1) * rowH - 8;
            const isLive = isToday && live >= c.s && live <= c.e;
            p.push(
              `<div class="card${isLive ? " live" : ""}" role="button" tabindex="0" data-i="${ci}" ` +
              `style="--rgb:${RGB[c.c] || RGB.amber};top:${top}px;height:${h}px;--d:${50 + (di*3 + ci%4)*32}ms">` +
              `<span class="edge"></span><div class="nm">${String(c.n).replace(/([（(][^）)]*[）)])/g, "<span class=nowrap>$1</span>")}</div>` +
              (h > 86 && c.r ? `<div class="rm">${c.r}</div>` : "") +
              `</div>`
            );
          });

          p.push("</div>");
        });
        p.push("</div></div>");
      } else {
        p.push('<div class="empty"><div class="big"><i></i>本周还没有课</div>点右下角的 <b>+</b> 添加，或者先看看下方这个校区的作息时间。</div>');
      }

      p.push('<div class="slots"><h2>' + campus.label + ' · 上课时间</h2><ol>');
      [["上午 · 第 1–4 节",[0,1,2,3]],["下午 · 第 5–8 节",[4,5,6,7]],["晚上 · 第 9–11 节",[8,9,10]]]
        .forEach(([name, idxs]) => {
          p.push(`<li class="grp">${name}</li>`);
          idxs.forEach((i) => {
            const [a,b] = campus.slots[i];
            p.push(`<li><b>第${i+1}节</b><span>${a} – ${b}</span></li>`);
          });
        });
      p.push("</ol></div>");

      board.innerHTML = p.join("");
      if (!animate) board.querySelectorAll(".card").forEach((el) => { el.style.animation = "none"; });
      board.classList.remove("out");

      board.querySelectorAll(".card").forEach((el) => {
        const idx = Number(el.dataset.i);
        const open = () => openSheet(campus.courses[idx], idx);
        el.addEventListener("click", open);
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
        });
      });

      const sc = board.querySelector(".scroller");
      const target = board.querySelector(`.day[data-day="${today}"]`);
      if (sc) {
        if (animate && target && today > 3) sc.scrollTo({ left: Math.max(0, target.offsetLeft - 130), behavior: "smooth" });
        else sc.scrollLeft = keepLeft;
      }
    }, animate ? 170 : 0);
  }

  function openSheet(c, idx) {
    if (!c) return;
    lastPick = { scope: current, index: idx };
    const campus = DATA[current];
    const [a] = campus.slots[c.s - 1], [, b] = campus.slots[c.e - 1];
    $("s-tag").textContent = c.g || "课程";
    $("s-tag").style.setProperty("--c", `rgb(${RGB[c.c] || RGB.amber})`);
    $("s-name").textContent = c.n;
    $("s-time").textContent = `${a} – ${b}`;
    $("s-slots").textContent = c.s === c.e ? `第 ${c.s} 节` : `第 ${c.s} – ${c.e} 节`;
    $("s-room").textContent = c.r || "—";
    $("s-campus").textContent = campus.label;
    veil.classList.add("on");
    sheet.classList.add("on");
  }

  function closeSheet() {
    veil.classList.remove("on");
    sheet.classList.remove("on");
    editor.classList.remove("on");
  }

  function openEditor(scope, index) {
    const isNew = index === null || index === undefined;
    const campus = DATA[scope];
    const src = isNew ? {d:1, s:1, e:1, n:"", r:"", c:"amber", g:"课程"} : campus.courses[index];
    if (!src) return;
    editing = { scope, index: isNew ? null : index };
    pickDay = src.d;
    pickColor = src.c || "amber";

    $("ed-title").textContent = isNew ? "添加到" + campus.label : "编辑课程";
    $("ed-name").value = src.n;
    $("ed-room").value = src.r || "";

    $("ed-day").innerHTML = WEEK.map((w, i) =>
      `<button type="button" class="pill${i+1 === pickDay ? " on" : ""}" data-day="${i+1}">${w.w.slice(1)}</button>`
    ).join("");

    $("ed-color").innerHTML = COLORS.map((k) =>
      `<button type="button" class="sw${k === pickColor ? " on" : ""}" data-c="${k}" style="background:rgb(${RGB[k]})"></button>`
    ).join("");

    const opts = campus.slots.map(([a], i) => `<option value="${i+1}">第${i+1}节 ${a}</option>`).join("");
    $("ed-start").innerHTML = opts;
    $("ed-end").innerHTML = opts;
    $("ed-start").value = src.s;
    $("ed-end").value = src.e;

    $("ed-del").style.display = isNew ? "none" : "";
    $("ed-del").textContent = "删除";
    armed = false;

    closeSheet();
    veil.classList.add("on");
    editor.classList.add("on");
    setTimeout(() => { try { $("ed-name").focus({ preventScroll: true }); } catch (e) {} }, 480);
  }

  function commit() {
    const name = $("ed-name").value.trim();
    if (!name) {
      $("ed-name").style.borderColor = "rgba(255,139,120,.75)";
      $("ed-name").focus();
      return;
    }
    let s = Number($("ed-start").value);
    let e = Number($("ed-end").value);
    if (e < s) e = s;
    const scope = editing.scope, list = DATA[scope].courses;
    const prev = editing.index === null ? null : list[editing.index];
    const course = {
      d: pickDay, s, e,
      n: name,
      r: $("ed-room").value.trim() || "地点待定",
      c: pickColor,
      g: (prev && prev.g) || "课程"
    };
    if (editing.index === null) list.push(course);
    else list[editing.index] = course;
    persist();
    closeSheet();
    render(current, true);
  }

  function removeCourse() {
    if (editing.index === null) return;
    DATA[editing.scope].courses.splice(editing.index, 1);
    persist();
    closeSheet();
    render(current, true);
  }

  veil.addEventListener("click", closeSheet);
  $("s-close").addEventListener("click", closeSheet);
  $("s-edit").addEventListener("click", () => {
    if (lastPick) openEditor(lastPick.scope, lastPick.index);
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

  $("fab").addEventListener("click", () => openEditor(current, null));

  $("ed-day").addEventListener("click", (e) => {
    const b = e.target.closest("[data-day]");
    if (!b) return;
    pickDay = Number(b.dataset.day);
    [...$("ed-day").children].forEach((x) => x.classList.toggle("on", x === b));
  });
  $("ed-color").addEventListener("click", (e) => {
    const b = e.target.closest("[data-c]");
    if (!b) return;
    pickColor = b.dataset.c;
    [...$("ed-color").children].forEach((x) => x.classList.toggle("on", x === b));
  });
  $("ed-name").addEventListener("input", () => { $("ed-name").style.borderColor = "var(--line)"; });
  $("ed-save").addEventListener("click", commit);

  $("ed-del").addEventListener("click", () => {
    if (!armed) {
      armed = true;
      $("ed-del").textContent = "再点一次确认";
      setTimeout(() => { if (armed) { armed = false; $("ed-del").textContent = "删除"; } }, 3200);
      return;
    }
    removeCourse();
  });

  let resetArmed = false;
  $("reset").addEventListener("click", () => {
    if (!resetArmed) {
      resetArmed = true;
      $("reset").textContent = "再点一次恢复默认（会清掉你加的）";
      setTimeout(() => { if (resetArmed) { resetArmed = false; $("reset").textContent = "恢复默认课表"; } }, 3200);
      return;
    }
    resetArmed = false;
    $("reset").textContent = "恢复默认课表";
    try { localStorage.removeItem(KEY); } catch (e) {}
    DATA = load();
    render(current, true);
  });

  buttons.forEach((btn, i) => {
    btn.addEventListener("click", () => {
      if (busy || btn.dataset.campus === current) return;
      busy = true;
      current = btn.dataset.campus;
      buttons.forEach((b) => b.setAttribute("aria-selected", String(b === btn)));
      thumb.style.transform = `translateX(${i * 100}%)`;
      render(current, true);
      setTimeout(() => { busy = false; }, 540);
    });
  });

  const t = todayIdx();
  if (t > 0) $("range").textContent = `11.02 – 11.08 · 第10教学周 · 今天是${WEEK[t-1].w}`;

  render("tianmuhu", true);
  setInterval(() => { if (!document.hidden) render(current, false); }, 60000);
})();
</script>
</body>
</html>
